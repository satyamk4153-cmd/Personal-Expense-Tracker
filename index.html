<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>Expense Tracker</h1>
      <p>Keep track of your spending.</p>
    </header>

    <section class="summary-grid" aria-label="Expense summary">
      <article class="summary-card total-card">
        <p>Total spent</p>
        <h2 id="totalSpent">₹0.00</h2>
      </article>
      <article class="summary-card count-card">
        <p>Transactions</p>
        <h2 id="transactionCount">0</h2>
      </article>
    </section>

    <section class="content-grid">
      <section class="panel form-panel">
        <div class="panel-heading">
          <h2>Add an expense</h2>
        </div>
        <form id="expenseForm" novalidate>
          <label for="expenseName">Expense name</label>
          <input id="expenseName" name="expenseName" type="text" placeholder="e.g. Groceries" maxlength="60" autocomplete="off" required />

          <label for="expenseAmount">Amount (₹)</label>
          <input id="expenseAmount" name="expenseAmount" type="number" placeholder="e.g. 450" min="0.01" step="0.01" inputmode="decimal" required />

          <label for="expenseCategory">Category</label>
          <select id="expenseCategory" name="expenseCategory">
            <option value="Education">Education</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <p id="formError" class="form-error" role="alert" aria-live="polite"></p>
          <button class="add-button" type="submit">Add expense <span aria-hidden="true">→</span></button>
        </form>
      </section>

      <section class="panel activity-panel">
        <div class="activity-heading">
          <h2>Recent expenses</h2>
          <label for="categoryFilter">
            <select id="categoryFilter">
              <option value="All">All categories</option>
              <option value="Education">Education</option>
              <option value="Food">Food</option>
              <option value="Shopping">Shopping</option>
              <option value="Travel">Travel</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </label>
        </div>
        <div id="expenseList" class="expense-list" aria-live="polite"></div>
        <p id="emptyState" class="empty-state">No expenses yet.</p>
      </section>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
